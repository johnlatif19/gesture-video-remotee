<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة التحكم</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <div class="wrap">
    <header class="row">
      <h1 id="hi">الفيديوهات</h1>
      <div class="links">
        <a class="btn" href="/remote">فتح الريموت</a>
        <button id="out" class="danger" type="button">خروج</button>
      </div>
    </header>

    <section class="card">
      <h2>رفع فيديو</h2>
      <label class="field">
        <span>الملف</span>
        <input type="file" id="file" accept="video/*">
      </label>

      <div class="progress-wrap" id="progWrap" hidden>
        <div class="ring" id="ring">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
            <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="ring-label">
            <span id="pct">0%</span>
          </div>
        </div>
        <div class="progress-meta">
          <div id="eta">جارٍ الحساب…</div>
          <div id="speed" class="muted"></div>
        </div>
      </div>

      <div class="err" id="err"></div>
      <button id="up" type="button">رفع الفيديو</button>
      <p class="muted">الرفع يذهب إلى Cloudinary مباشرة. الخطة المجانية لها حد للمساحة وحجم الملف.</p>
    </section>

    <section id="list" class="list"></section>
  </div>
  <script src="/js/dashboard.js"></script>
</body>
</html>
