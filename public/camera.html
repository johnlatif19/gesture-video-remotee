<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الكاميرا</title>
  <link rel="stylesheet" href="/css/camera.css">
</head>
<body>
  <h1>الكاميرا</h1>

  <form class="card" id="pair">
    <p class="muted">اكتب الكود الظاهر على صفحة الريموت</p>
    <label class="field">
      <span>كود الربط</span>
      <input id="code" inputmode="numeric" maxlength="6" pattern="\d{6}" placeholder="000000" autocomplete="off" required>
    </label>
    <div class="err" id="err"></div>
    <button type="submit">ربط</button>
  </form>

  <div id="live" hidden>
    <div class="stage">
      <video id="cam" autoplay playsinline muted></video>
      <canvas id="cv"></canvas>
    </div>
    <div class="badge" id="badge"></div>
    <div class="card wide">
      <div id="state" class="ok">متصل</div>
      <ul class="help">
        <li><b>قبضة مقفولة</b><span class="e">تشغيل</span></li>
        <li><b>إصبع السبابة لأعلى</b><span class="e">رجوع 5 ثوانٍ</span></li>
        <li><b>تحريك اليد لليمين</b><span class="e">تقديم 5 ثوانٍ</span></li>
        <li><b>كف مفتوح</b><span class="e">إيقاف</span></li>
      </ul>
      <label class="inline">
        <input type="checkbox" id="rev">
        <span>عكس اتجاه التقديم</span>
      </label>
    </div>
  </div>

  <script type="module" src="/js/camera.js"></script>
</body>
</html>
